<!DOCTYPE html>
<html>

<head>
    <title>CF TechLab Assistant</title>
    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        #chatbox {
            width: 400px;
            height: 400px;
            border: 1px solid #ccc;
            padding: 10px;
            overflow-y: scroll;
        }

        .msg {
            margin: 5px 0;
        }

        .you {
            color: blue;
        }

        .bot {
            color: green;
        }
    </style>
</head>

<body>

    <h2>CF TechLab Live Chat</h2>
    <div id="chatbox"></div>

    <input id="msg" type="text" placeholder="Type message..." style="width:300px;">
    <button onclick="sendMessage()">Send</button>

    <script>
        async function sendMessage() {
            let text = document.getElementById("msg").value;
            document.getElementById("chatbox").innerHTML += `<div class='msg you'><b>You:</b> ${text}</div>`;

            let response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: text })
            });

            let data = await response.json();
            document.getElementById("chatbox").innerHTML += `<div class='msg bot'><b>Bot:</b> ${data.reply}</div>`;
            document.getElementById("msg").value = "";
        }
    </script>

</body>

</html>
