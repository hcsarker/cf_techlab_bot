<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - CF TechLab Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .header h1 {
            color: #2563eb;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .stat-card .number {
            font-size: 48px;
            font-weight: bold;
            color: #2563eb;
            margin: 10px 0;
        }

        .stat-card .label {
            font-size: 14px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .section h2 {
            color: #1e293b;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
        }

        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #64748b;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab.active {
            color: #2563eb;
            border-bottom-color: #2563eb;
            font-weight: 600;
        }

        .tab:hover {
            color: #2563eb;
        }

        .conversation-list {
            max-height: 600px;
            overflow-y: auto;
        }

        .conversation-item {
            background: #f8fafc;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #e2e8f0;
            transition: all 0.3s;
        }

        .conversation-item:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-left-color: #2563eb;
        }

        .conversation-item.low-confidence {
            border-left-color: #f59e0b;
        }

        .conversation-item.negative {
            border-left-color: #ef4444;
        }

        .conversation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .confidence-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .confidence-high {
            background: #dcfce7;
            color: #166534;
        }

        .confidence-medium {
            background: #fef3c7;
            color: #92400e;
        }

        .confidence-low {
            background: #fee2e2;
            color: #991b1b;
        }

        .message-pair {
            margin: 10px 0;
        }

        .message-label {
            font-size: 12px;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .message-text {
            background: white;
            padding: 12px;
            border-radius: 8px;
            color: #1e293b;
        }

        .user-message {
            border-left: 3px solid #2563eb;
        }

        .bot-message {
            border-left: 3px solid #10b981;
        }

        .feedback-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .feedback-positive {
            background: #dcfce7;
            color: #166534;
        }

        .feedback-negative {
            background: #fee2e2;
            color: #991b1b;
        }

        .timestamp {
            font-size: 12px;
            color: #94a3b8;
        }

        .export-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .export-btn:hover {
            background: #1e40af;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(37, 99, 235, 0.3);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .empty-state .icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* Scrollbar Styling */
        .conversation-list::-webkit-scrollbar {
            width: 8px;
        }

        .conversation-list::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }

        .conversation-list::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .conversation-list::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎛️ Admin Dashboard</h1>
            <p style="color: #64748b;">Monitor chatbot performance and review user feedback</p>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="loading">Loading statistics...</div>
        </div>

        <div class="section">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('low-confidence')">⚠️ Low Confidence</button>
                <button class="tab" onclick="switchTab('negative-feedback')">👎 Negative Feedback</button>
            </div>

            <div id="conversationContent">
                <div class="loading">Loading conversations...</div>
            </div>

            <button class="export-btn" onclick="exportTrainingData()">
                📥 Export Training Data
            </button>
        </div>
    </div>

    <script>
        let currentTab = 'low-confidence';

        // Load statistics
        async function loadStats() {
            try {
                const response = await fetch('/admin/stats');
                const stats = await response.json();
                
                const statsGrid = document.getElementById('statsGrid');
                statsGrid.innerHTML = `
                    <div class="stat-card">
                        <div class="icon">💬</div>
                        <div class="number">${stats.total_conversations}</div>
                        <div class="label">Total Conversations</div>
                    </div>
                    <div class="stat-card">
                        <div class="icon">📊</div>
                        <div class="number">${(stats.average_confidence * 100).toFixed(1)}%</div>
                        <div class="label">Avg Confidence</div>
                    </div>
                    <div class="stat-card">
                        <div class="icon">👍</div>
                        <div class="number">${stats.positive_feedback}</div>
                        <div class="label">Positive Feedback</div>
                    </div>
                    <div class="stat-card">
                        <div class="icon">👎</div>
                        <div class="number">${stats.negative_feedback}</div>
                        <div class="label">Negative Feedback</div>
                    </div>
                    <div class="stat-card">
                        <div class="icon">⚠️</div>
                        <div class="number">${stats.low_confidence_count}</div>
                        <div class="label">Low Confidence</div>
                    </div>
                    <div class="stat-card">
                        <div class="icon">📈</div>
                        <div class="number">${stats.feedback_rate}%</div>
                        <div class="label">Feedback Rate</div>
                    </div>
                `;
            } catch (error) {
                document.getElementById('statsGrid').innerHTML = '<div class="loading">Error loading statistics</div>';
            }
        }

        // Load conversations
        async function loadConversations(type) {
            const content = document.getElementById('conversationContent');
            content.innerHTML = '<div class="loading">Loading conversations...</div>';

            try {
                const endpoint = type === 'low-confidence' ? '/admin/low-confidence' : '/admin/negative-feedback';
                const response = await fetch(endpoint);
                const conversations = await response.json();

                if (conversations.length === 0) {
                    content.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">🎉</div>
                            <h3>No ${type === 'low-confidence' ? 'low confidence' : 'negative feedback'} conversations</h3>
                            <p>Everything is looking good!</p>
                        </div>
                    `;
                    return;
                }

                content.innerHTML = `<div class="conversation-list">${conversations.map(conv => `
                    <div class="conversation-item ${type === 'low-confidence' ? 'low-confidence' : 'negative'}">
                        <div class="conversation-header">
                            <div>
                                <span class="confidence-badge ${getConfidenceClass(conv.confidence)}">
                                    ${(conv.confidence * 100).toFixed(1)}% confidence
                                </span>
                                ${conv.feedback ? `<span class="feedback-badge feedback-${conv.feedback}">${conv.feedback === 'positive' ? '👍' : '👎'} ${conv.feedback}</span>` : ''}
                            </div>
                            <span class="timestamp">${new Date(conv.timestamp).toLocaleString()}</span>
                        </div>
                        
                        <div class="message-pair">
                            <div class="message-label">👤 User Message:</div>
                            <div class="message-text user-message">${conv.user_message}</div>
                        </div>
                        
                        <div class="message-pair">
                            <div class="message-label">🤖 Bot Response (${conv.intent_tag}):</div>
                            <div class="message-text bot-message">${conv.bot_response}</div>
                        </div>
                    </div>
                `).join('')}</div>`;
            } catch (error) {
                content.innerHTML = '<div class="loading">Error loading conversations</div>';
            }
        }

        function getConfidenceClass(confidence) {
            if (confidence >= 0.8) return 'confidence-high';
            if (confidence >= 0.5) return 'confidence-medium';
            return 'confidence-low';
        }

        function switchTab(tab) {
            currentTab = tab;
            
            // Update active tab
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            // Load conversations for selected tab
            loadConversations(tab);
        }

        async function exportTrainingData() {
            try {
                const response = await fetch('/admin/export');
                const data = await response.json();
                
                // Download as JSON file
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `training_data_${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                alert('✅ Training data exported successfully!');
            } catch (error) {
                alert('❌ Error exporting training data');
            }
        }

        // Initialize dashboard
        loadStats();
        loadConversations('low-confidence');

        // Auto-refresh every 30 seconds
        setInterval(() => {
            loadStats();
            loadConversations(currentTab);
        }, 30000);
    </script>
</body>
</html>
