services:
  - type: web
    name: cf-techlab-bot
    env: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --worker-class gthread --threads 8 --bind 0.0.0.0:$PORT --timeout 120 --log-level info
    healthCheckPath: /health
